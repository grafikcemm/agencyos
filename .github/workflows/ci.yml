name: CI

# Coverage kapısı (vitest.config.ts thresholds) ZORUNLU ayrı komuttur:
# `npm test` eşikleri UYGULAMAZ; kapı `npm run test:coverage` ile geçilir.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: test-results/coverage/coverage-summary.json
          if-no-files-found: ignore
